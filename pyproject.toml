[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "harness-awm"
version = "0.1.0"
description = "Auditable AWM execution, collection and evaluation harness"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "jsonschema>=4.26,<5", "httpx>=0.28,<1", "mcp>=1.26,<2", "openai>=2.17,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]
tokens = ["transformers>=4.46,<5"]

[project.scripts]
harness-awm = "harness_awm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["harness_awm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

